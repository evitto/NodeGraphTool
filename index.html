<style>
:root{--bg:#15181c;--p:#15181c;--p2:#1e2328;--bd:#262c33;--tx:#d3d9df;--mu:#7a848e;--ac:#5fd4c8;--pop:#1e2328;--box:#252c34;--boxb:#46525e;--dg:#e26d6d;--acH:#82e3d9;--onAc:#06201d}
:root[data-theme=light]{--bg:#f3f5f7;--p:#f3f5f7;--p2:#e6ebef;--bd:#d3dae0;--tx:#1d252d;--mu:#5d6873;--ac:#0b8a80;--pop:#fff;--box:#fff;--boxb:#c4ccd4;--dg:#c94a4a;--acH:#0a766d;--onAc:#fff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.5 "Inter","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;gap:2px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{font-size:13px;font-weight:600;margin-right:14px;letter-spacing:.2px}.sp{flex:1}
button,input,select,textarea{font:inherit;color:var(--tx);background:transparent;border:0;border-radius:6px;padding:5px 9px}
button{cursor:pointer;color:var(--mu)}button:hover{color:var(--tx);background:var(--p2)}
button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}button.dg:hover{color:#f08a8a;background:rgba(240,138,138,.12)}
input,select,textarea{background:var(--p2)}input::placeholder{color:var(--mu);opacity:1}
input[type=search]{width:150px;margin-left:10px}
:focus-visible{outline:1.5px solid var(--ac);outline-offset:1px}#cv [data-id]:focus,#cv [data-id]:focus-visible{outline:none}#cv [data-id]:focus-visible>rect{stroke-width:2px}
main{flex:1;display:flex;min-height:0;position:relative}#cv,#cv *,button,#hint,#rz,.lg,h3,.ct th{-webkit-user-select:none;user-select:none}
#hint{position:absolute;left:16px;bottom:12px;font-size:11px;color:var(--mu);pointer-events:none;z-index:1}#dl{margin-left:6px;width:112px}#mdl,#pm{position:fixed;inset:0;background:rgba(6,8,10,.85);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50}#mdl .box,#pm .box{background:var(--box);border:1px solid var(--boxb);border-radius:10px;padding:20px;width:min(400px,90vw);box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.7)}#mdl p{margin:0 0 18px;white-space:pre-line;font-size:14px}#mdl .act{display:flex;gap:8px;justify-content:flex-end}#mdl .pri{background:var(--ac);color:var(--onAc);font-weight:600}#mdl .pri:hover{background:var(--acH);color:var(--onAc)}#mdl .danger{background:var(--dg);color:#1a0a0a}#mdl .danger:hover{background:#ef8a8a;color:#1a0a0a}
#cv.st-node [data-group],#cv.st-node [data-link],#cv.st-node [data-kind=note],#cv.st-node [data-kind=image],#cv.st-note [data-group],#cv.st-note [data-link],#cv.st-note [data-kind=node],#cv.st-note [data-kind=image],#cv.st-image [data-group],#cv.st-image [data-link],#cv.st-image [data-kind=node],#cv.st-image [data-kind=note]{pointer-events:none}#cv.st-group [data-id],#cv.st-group [data-link]{pointer-events:none}#cv.st-group [data-group]>rect{pointer-events:all!important;cursor:pointer}#bSel{width:auto;gap:2px;padding:0 6px}#bSel .cr{width:9px;height:9px;opacity:.7}#sm{position:fixed;z-index:25;background:var(--pop);border:1px solid var(--bd);border-radius:8px;padding:4px;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px}#sm button{display:flex;align-items:center;gap:8px;justify-content:flex-start;text-align:left;width:100%}svg.ti{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}#sm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#sm .k{margin-left:auto;color:var(--mu);font-size:11px}#cv.wt [data-id],#cv.wt [data-group]{pointer-events:none}#cv.wt [data-id]{opacity:.45}#cv.wt [data-link]{cursor:pointer}[data-port]{cursor:pointer}#nt .pr{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}#nt .k{color:var(--mu)}#nt .nn.sep{margin-top:7px;padding-top:7px;border-top:1px solid var(--bd)}#nt{position:fixed;z-index:60;display:none;max-width:320px;max-height:40vh;overflow:hidden;padding:8px 10px;background:var(--pop);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font-size:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}#pop{position:fixed;z-index:20;background:var(--pop);border:1px solid var(--bd);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.45)}#pop button{text-align:left}#pop input{margin-top:4px}#pm tbody tr{cursor:pointer}#pm tbody tr:hover td{background:var(--p2)}#pm tbody tr.cur td{background:color-mix(in srgb,var(--ac) 16%,transparent);font-weight:600}#pm tbody tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--ac)}#pm td:first-child{cursor:grab}#pm tr.dragging{opacity:.4}#pm tr.dropb td{box-shadow:inset 0 2px 0 var(--ac)}#pm tr.dropa td{box-shadow:inset 0 -2px 0 var(--ac)}.vr{width:1px;height:16px;background:var(--bd);margin:0 8px}#bAdd{background:var(--ac);color:var(--onAc);font-weight:600;margin-right:4px}#bAdd:hover{background:var(--acH);color:var(--onAc)}
#cv{flex:1;min-width:0;background:var(--bg);cursor:default;touch-action:none}
